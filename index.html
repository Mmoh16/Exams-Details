<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Resources</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Very light slate background */
        }
        /* Ensure the iframe containers fill the card properly */
        .video-container {
            width: 100%;
            background-color: #000;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 py-12 px-4 sm:px-6 lg:px-8">
    
    <main class="max-w-4xl mx-auto space-y-12">
        
        <!-- Page Header -->
        <header class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-bold text-slate-900 tracking-tight mb-4">
                Video Resources
            </h1>
            <p class="text-lg text-slate-500 max-w-2xl mx-auto">
                Watch the introductory material and sample exam reviews below.
            </p>
        </header>

        <!-- Video 1: Introduction -->
        <article class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-shadow hover:shadow-md">
            <div class="p-6 border-b border-slate-100 bg-slate-50">
                <h2 class="text-2xl font-semibold text-slate-800 text-center">Introduction</h2>
            </div>
            <div class="video-container">
                <div style="padding:52.5% 0 0 0;position:relative;">
                    <iframe src="https://player.vimeo.com/video/1181905469?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="introduction est may advanced.mp4"></iframe>
                </div>
            </div>
        </article>

        <!-- Video 2: Sample EST March -->
        <article class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-shadow hover:shadow-md">
            <div class="p-6 border-b border-slate-100 bg-slate-50">
                <h2 class="text-2xl font-semibold text-slate-800 text-center">Sample EST March</h2>
            </div>
            <div class="video-container">
                <div style="padding:75% 0 0 0;position:relative;">
                    <iframe src="https://player.vimeo.com/video/1181905435?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="sample of march est exam.mp4"></iframe>
                </div>
            </div>
        </article>

        <!-- Video 3: Sample Questions -->
        <article class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-shadow hover:shadow-md">
            <div class="p-6 border-b border-slate-100 bg-slate-50">
                <h2 class="text-2xl font-semibold text-slate-800 text-center">Sample Questions</h2>
            </div>
            <div class="video-container">
                <div style="padding: 52.5% 0 0 0; position: relative;">
                    <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" title="sample of Qs mn 3mo ramez.mp4" src="https://player.vimeo.com/video/1181905450?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"></iframe>
                </div>
            </div>
        </article>

    </main>

    <!-- Vimeo Player API Script (Included only once at the bottom) -->
    <script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
